    <title>城市咖啡选址助手（瑞幸视角）</title>
    <style>

      body {

        min-height: 100%;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: #1f2937;

      }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #controls {
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;

        gap: 8px;
        flex-wrap: wrap;
        background: rgba(255, 255, 255, 0.98);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      #layout {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #sidebar {
        width: 360px;
        border-right: 1px solid #e5e7eb;
        overflow-y: auto;

      }
      #map-shell {

      .floating-toggle {
        position: absolute;

    <div id="layout">
      <div id="sidebar">
        <div class="hint">
          目标：找出“人流吸引业态多，且候选点半径 1000 米内无瑞幸”的候选热区。<br />
          最近瑞幸距离按直线距离计算；点击左侧热区后会自动定位到街区级别。

    <script>
      let map = null;
      let mapReadyPromise = null;
      let mapSdkPatched = false;
      let activeHotspotIndex = 0;
      let currentHeatGroup = null;
      let currentMarkers = [];
      let lastData = null;
      let authToken = localStorage.getItem("authToken") || "";
      let baseTileLayer = null;
      const PAGE_PARAMS = new URLSearchParams(window.location.search);
      const API_BASE = resolveApiBase();
      const CITY_VIEW = {
        Beijing: { center: [116.3974, 39.9093], zoom: 12, nameZh: "北京市" },
        Huizhou: { center: [114.455, 23.0817], zoom: 13, nameZh: "惠州市" },
        Anshan: { center: [122.9902, 41.1076], zoom: 13, nameZh: "鞍山市" },
      };

      function resolveApiBase() {
        const fromQuery = (PAGE_PARAMS.get("apiBase") || "").trim();
        if (fromQuery) return fromQuery.replace(/\/+$/, "");
        const fromStorage = (localStorage.getItem("apiBase") || "").trim();
        if (fromStorage) return fromStorage.replace(/\/+$/, "");
        if (window.location.protocol === "file:") return "http://127.0.0.1:8008";
        return window.location.origin.replace(/\/+$/, "");
      }

      function getNextPath() {
        const next = (PAGE_PARAMS.get("next") || "").trim();
        return next.startsWith("/") ? next : "";
      }

      function redirectAfterLoginIfNeeded() {
        const next = getNextPath();
        if (next) {
          window.location.replace(next);
          return true;
        }
        return false;
      }

      function apiUrl(path) {
        return `${API_BASE}${path}`;
      }

      function applyFilterCollapseUI() {
        const collapsed = document.body.classList.contains("filters-collapsed");
        document.querySelectorAll('[data-role="toggle-filters"]').forEach((btn) => {
          btn.textContent = collapsed ? "展开筛选" : "收起筛选";
        });
      }

      function toggleFilters(force) {
        const next =
          typeof force === "boolean"
            ? force
            : !document.body.classList.contains("filters-collapsed");
        document.body.classList.toggle("filters-collapsed", next);
        try {
          localStorage.setItem("cityAnalysisFiltersCollapsed", next ? "1" : "0");
        } catch (error) {}
        applyFilterCollapseUI();
        if (typeof window.dispatchEvent === "function") {
          window.dispatchEvent(new Event("resize"));
        }
      }

      function redirectToLogin() {
        const next = `${window.location.pathname}${window.location.search || ""}`;
        window.location.replace(`/?next=${encodeURIComponent(next)}`);
      }

      function setPageMessage(message = "", isError = true) {
        const el = document.getElementById("page-message");
        el.textContent = message || "";
        el.style.color = isError ? "#b42318" : "#6b7280";
      }

      function setMapStatus(message) {
        document.getElementById("map-status").textContent = message;
      }

      function setAuthUI(loggedIn, username = "") {
        document.getElementById("logout-btn").style.display = loggedIn
          ? "inline-block"
          : "none";
        document.getElementById("analyze-btn").disabled = !loggedIn;
        document.getElementById("auth-status").textContent = loggedIn
          ? `已登录：${username}`
          : "未登录";
      }

      function proxiedAmapUrl(src, assetType = "asset") {
        try {
          const url = new URL(src, window.location.href);
          const hostname = (url.hostname || "").toLowerCase();
          const isAmapScriptHost = hostname === "webapi.amap.com";
          const isAmapTileHost =
            hostname.endsWith(".is.autonavi.com") &&
            /^(webrd0|wprd0|webst0)/.test(hostname);

          if (!isAmapScriptHost && !isAmapTileHost) return src;

          const proxyPath =
            assetType === "script" ? "/proxy/remote-script?url=" : "/proxy/remote-asset?url=";
          return `${API_BASE}${proxyPath}${encodeURIComponent(url.href)}`;
        } catch (error) {
          return src;
        }
      }

      function patchAmapAssetProxy() {
        if (mapSdkPatched) return;
        mapSdkPatched = true;

        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function patchedSetAttribute(name, value) {
          if (
            typeof value === "string" &&
            (name === "src" || name === "href") &&
            this &&
            (this.tagName === "SCRIPT" || this.tagName === "IMG")
          ) {
            const assetType = this.tagName === "SCRIPT" ? "script" : "asset";
            value = proxiedAmapUrl(value, assetType);
          }
          return originalSetAttribute.call(this, name, value);
        };

        const imageSrcDescriptor = Object.getOwnPropertyDescriptor(
          HTMLImageElement.prototype,
          "src"
        );
        if (imageSrcDescriptor && imageSrcDescriptor.set) {
          Object.defineProperty(HTMLImageElement.prototype, "src", {
            configurable: true,
            enumerable: imageSrcDescriptor.enumerable,
            get: imageSrcDescriptor.get,
            set(value) {
              return imageSrcDescriptor.set.call(this, proxiedAmapUrl(value, "asset"));
            },
          });
        }
      }

      function buildAmapTileUrl(x, y, z) {
        const rawUrl =
          `https://webrd01.is.autonavi.com/appmaptile?` +
          `lang=zh_cn&size=1&scale=1&style=7&x=${x}&y=${y}&z=${z}`;
        return proxiedAmapUrl(rawUrl, "asset");
      }

      function loadAmapSdk() {
        if (window.AMap && typeof window.AMap.Map === "function") {
          return Promise.resolve();
        }
        if (mapReadyPromise) return mapReadyPromise;

        patchAmapAssetProxy();
        const sdkUrl =
          `${API_BASE}/proxy/remote-script?url=` +
          encodeURIComponent(`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}`);

        mapReadyPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = sdkUrl;
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("amap_sdk_loader_failed"));
          document.head.appendChild(script);
        })
          .then(() => {
            if (!window.AMap || typeof window.AMap.Map !== "function") {
              throw new Error("AMap unavailable after load");
            }
          })
          .catch((error) => {
            mapReadyPromise = null;
            throw error;
          });

        return mapReadyPromise;
      }

      function getSafeZoom(defaultZoom = 11) {
        if (!map || typeof map.getZoom !== "function") return defaultZoom;
        const zoom = Number(map.getZoom());
        return Number.isFinite(zoom) ? zoom : defaultZoom;
      }

      function resizeHeatCanvas() {
        const shell = document.getElementById("map-shell");
        const canvas = document.getElementById("heatmap-canvas");
        const width = shell.clientWidth;
        const height = shell.clientHeight;
        if (!width || !height) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clearHeatmap() {
        const canvas = document.getElementById("heatmap-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function getAmapLocation(item) {
        return item?.location_gcj02 || item?.location || null;
      }

      function getLngLatNumbers(location) {
        if (!location) return null;
        const lng =
          typeof location.getLng === "function" ? Number(location.getLng()) : Number(location.lng);
        const lat =
          typeof location.getLat === "function" ? Number(location.getLat()) : Number(location.lat);
        if (!Number.isFinite(lng) || !Number.isFinite(lat)) return null;
        return { lng, lat };
      }

      function haversineDistanceM(a, b) {
        if (!a || !b) return Infinity;
        const R = 6371000;
        const toRad = (deg) => (deg * Math.PI) / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const lat1 = toRad(a.lat);
        const lat2 = toRad(b.lat);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      function dedupePlaces(items) {
        const seen = new Set();
        const output = [];
        (items || []).forEach((item) => {
          const loc = getAmapLocation(item);
          if (!loc) return;
          const key =
            item.id ||
            `${item.name || ""}|${Number(loc.lng).toFixed(5)}|${Number(loc.lat).toFixed(5)}`;
          if (seen.has(key)) return;
          seen.add(key);
          output.push(item);
        });
        return output;
      }

      async function ensureAmapPlaceSearch() {
        await ensureMapReady();
        if (window.AMap && typeof window.AMap.PlaceSearch === "function") return;
        await new Promise((resolve, reject) => {
          window.AMap.plugin(["AMap.PlaceSearch"], () => {
            if (typeof window.AMap.PlaceSearch === "function") resolve();
            else reject(new Error("AMap.PlaceSearch 插件加载失败"));
          });
        });
      }

      async function amapSearchKeyword(city, keyword, category, maxPages = 2) {
        await ensureAmapPlaceSearch();
        const cityName = (CITY_VIEW[city] || CITY_VIEW.Huizhou).nameZh;
        const all = [];

        for (let pageIndex = 1; pageIndex <= maxPages; pageIndex += 1) {
          const page = await new Promise((resolve) => {
            const service = new window.AMap.PlaceSearch({
              city: cityName,
              citylimit: true,
              pageSize: 50,
              pageIndex,
              extensions: "all",
            });
            service.search(keyword, (status, result) => {
              if (status !== "complete" || !result || !result.poiList) {
                resolve([]);
                return;
              }
              resolve(result.poiList.pois || []);
            });
          });

          if (!page.length) break;
          page.forEach((poi) => {
            const loc = getLngLatNumbers(poi.location);
            if (!loc) return;
            all.push({
              id: poi.id || "",
              name: poi.name || keyword,
              address:
                [poi.pname, poi.cityname, poi.adname, poi.address]
                  .filter(Boolean)
                  .join("") || "",
              category,
              location: loc,
              location_gcj02: loc,
              tags: {
                source: "amap",
                type: poi.type || "",
                tel: poi.tel || "",
              },
            });
          });

          if (page.length < 50) break;
        }
        return dedupePlaces(all);
      }

      async function fetchAmapLuckinStores(city) {
        const results = await Promise.all([
          amapSearchKeyword(city, "瑞幸咖啡", "瑞幸", 4),
          amapSearchKeyword(city, "luckin coffee", "瑞幸", 2),
        ]);
        return dedupePlaces(results.flat()).filter((item) => isLuckinName(item.name));
      }

      function applyLuckinMetrics(data, luckinStores) {
        data.luckin_stores = dedupePlaces(luckinStores);
        (data.hotspots || []).forEach((group) => {
          const spotLoc = getAmapLocation(group.spot);
          if (!spotLoc) return;
          const distances = data.luckin_stores
            .map((store) => ({
              store,
              distance: haversineDistanceM(spotLoc, getAmapLocation(store)),
            }))
            .filter((item) => Number.isFinite(item.distance))
            .sort((a, b) => a.distance - b.distance);

          const nearest = distances[0] || null;
          group.luckin_radius_m = 1000;
          group.luckin_count = distances.filter((item) => item.distance <= 1000).length;
          group.nearest_luckin_distance_m = nearest ? Math.round(nearest.distance) : null;
          group.nearest_luckin = nearest
            ? {
                name: nearest.store.name,
                address: nearest.store.address || "",
                distance_m: Math.round(nearest.distance),
                distance_type: "straight_line",
                location: getAmapLocation(nearest.store),
                location_gcj02: getAmapLocation(nearest.store),
              }
            : null;
        });
        return data;
      }

      async function buildAmapFallbackData(city) {
        setMapStatus("Overpass 不可用，正在切换高德 POI 数据分析...");
        const anchorDefs = [
          ["购物中心", "商场"],
          ["商场", "商场"],
          ["商业广场", "商圈"],
          ["写字楼", "写字楼"],
          ["大学", "大学"],
          ["火车站", "交通"],
          ["大型超市", "超市"],
        ];
        const attractorDefs = [
          ["餐饮", "餐饮"],
          ["咖啡", "咖啡"],
          ["奶茶", "奶茶"],
          ["便利店", "便利店"],
          ["超市", "超市"],
          ["写字楼", "写字楼"],
          ["大学", "大学"],
        ];

        const [anchorResults, attractorResults, luckinStores] = await Promise.all([
          Promise.all(anchorDefs.map(([keyword, category]) =>
            amapSearchKeyword(city, keyword, category, 2)
          )),
          Promise.all(attractorDefs.map(([keyword, category]) =>
            amapSearchKeyword(city, keyword, category, 2)
          )),
          fetchAmapLuckinStores(city),
        ]);

        let anchors = dedupePlaces(anchorResults.flat());
        const attractors = dedupePlaces(attractorResults.flat());

        if (!anchors.length) {
          anchors = attractors.slice(0, 80);
        }

        const groups = [];
        anchors.forEach((anchor) => {
          const anchorLoc = getAmapLocation(anchor);
          const nearby = attractors
            .map((place) => ({
              place,
              distance: haversineDistanceM(anchorLoc, getAmapLocation(place)),
            }))
            .filter((item) => item.distance <= 1200)
            .sort((a, b) => a.distance - b.distance)
            .map((item) => item.place);

          if (!nearby.length) return;
          const officeCount = nearby.filter((item) => item.category === "写字楼").length;
          groups.push({
            spot: {
              name: anchor.name,
              address: anchor.address || "",
              location: anchorLoc,
              location_gcj02: anchorLoc,
              coord_type: "gcj02",
              hot_score: nearby.length,
            },
            venues: nearby.slice(0, 80),
            office_count: officeCount,
          });
        });

        groups.sort((a, b) => (b.spot.hot_score || 0) - (a.spot.hot_score || 0));

        const spread = [];
        for (const group of groups) {
          const loc = getAmapLocation(group.spot);
          if (
            spread.some(
              (chosen) =>
                haversineDistanceM(loc, getAmapLocation(chosen.spot)) < 450
            )
          ) {
            continue;
          }
          spread.push(group);
          if (spread.length >= 30) break;
        }

        return applyLuckinMetrics(
          {
            city,
            source: "amap_fallback",
            hotspots: spread,
          },
          luckinStores
        );
      }

      async function enrichWithAmapLuckin(data, city) {
        try {
          const luckinStores = await fetchAmapLuckinStores(city);
          if (luckinStores.length) {
            return applyLuckinMetrics(data, luckinStores);
          }
        } catch (error) {
          console.warn("amap_luckin_enrich_failed", error);
        }
        return data;
      }

      function drawHeatmapForGroup(group) {
        if (!map || !group) {
          clearHeatmap();
          return;
        }

        resizeHeatCanvas();
        const canvas = document.getElementById("heatmap-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const venues = (group.venues || []).filter((item) => {
          const location = getAmapLocation(item);
          return (
            location &&
            Number.isFinite(location.lng) &&
            Number.isFinite(location.lat)
          );
        });

        venues.forEach((place) => {
          const location = getAmapLocation(place);
          const pixel = map.lngLatToContainer([location.lng, location.lat]);
          if (!pixel) return;
          const radius = Math.max(28, Math.min(84, getSafeZoom() * 4.5));
          const gradient = ctx.createRadialGradient(
            pixel.x,
            pixel.y,
            0,
            pixel.x,
            pixel.y,
            radius
          );
          gradient.addColorStop(0, "rgba(255, 87, 34, 0.35)");
          gradient.addColorStop(0.45, "rgba(255, 152, 0, 0.22)");
          gradient.addColorStop(1, "rgba(255, 193, 7, 0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(pixel.x, pixel.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function redrawHeatmap() {
        if (!document.getElementById("heatmap-toggle").checked) {
          clearHeatmap();
          return;
        }
        drawHeatmapForGroup(currentHeatGroup);
      }

      function buildMarkerContent(type, color) {
        const isHotspot = type === "hotspot";
        const isLuckin = type === "luckin";
        const size = isHotspot ? 34 : isLuckin ? 28 : 20;
        const stroke = isHotspot ? 4 : isLuckin ? 3 : 3;
        const center = size / 2;
        const radius = isHotspot ? 8 : isLuckin ? 7 : 5;
        const ringRadius = isHotspot ? 14 : isLuckin ? 11 : 8;
        return `
          <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${center}" cy="${center}" r="${ringRadius}" fill="${color}" fill-opacity="${isHotspot ? 0.18 : isLuckin ? 0.22 : 0.14}" />
            <circle cx="${center}" cy="${center}" r="${radius}" fill="${color}" stroke="white" stroke-width="${stroke}" />
          </svg>
        `;
      }

      function addMarker(location, title, color, type = "venue") {
        const marker = new window.AMap.Marker({
          position: [location.lng, location.lat],
          offset: new window.AMap.Pixel(
            type === "hotspot" ? -17 : type === "luckin" ? -14 : -10,
            type === "hotspot" ? -17 : type === "luckin" ? -14 : -10
          ),
          content: buildMarkerContent(type, color),
          title: title || "",
          anchor: "center",
          zIndex: type === "hotspot" ? 220 : type === "luckin" ? 200 : 120,
        });

        if (type === "hotspot") {
          marker.setLabel({
            direction: "right",
            offset: new window.AMap.Pixel(16, -18),
            content: `<div style="color:#9a3412;border:1px solid rgba(234,88,12,0.25);background:rgba(255,255,255,0.95);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,0.12);">${title || "候选热区"}</div>`,
          });
        }

        map.add(marker);
        currentMarkers.push(marker);
        return marker;
      }

      async function ensureMapReady() {
        if (map) return map;
        await loadAmapSdk();

        map = new window.AMap.Map("map", {
          zoom: 11,
          center: [116.3974, 39.9093],
          viewMode: "2D",
          resizeEnable: true,
        });

        baseTileLayer = new window.AMap.TileLayer({
          zIndex: 1,
          opacity: 1,
          tileSize: 256,
          getTileUrl(x, y, z) {
            return buildAmapTileUrl(x, y, z);
          },
        });
        map.setLayers([baseTileLayer]);

        map.on("moveend", redrawHeatmap);
        map.on("zoomend", redrawHeatmap);
        window.addEventListener("resize", () => {
          if (!map) return;
          map.resize();
          redrawHeatmap();
        });

        setMapStatus("高德动态地图已就绪。");
        return map;
      }

      function clearMarkers() {
        if (!map) return;
        if (currentMarkers.length) {
          map.remove(currentMarkers);
        }
        currentMarkers = [];
      }

      async function renderMap(data, idx = 0) {
        const hotspots = (data && data.hotspots) || [];
        const group = hotspots[idx] || hotspots[0];
        if (!group || !group.spot) {
          setMapStatus("没有可显示的地图数据。");
          clearMarkers();
          clearHeatmap();
          return;
        }

        await ensureMapReady();
        activeHotspotIndex = idx;
        currentHeatGroup = group;
        clearMarkers();

        const spot = group.spot;
        const spotLocation = getAmapLocation(spot);
        const venues = group.venues || [];
        if (!spotLocation) {
          setMapStatus("热区缺少可用坐标。");
          return;
        }

        addMarker(spotLocation, spot.name || "候选热区", "#f97316", "hotspot");

        venues.slice(0, 60).forEach((place) => {
          const location = getAmapLocation(place);
          if (!location) return;
          addMarker(location, place.name || place.category || "门店", "#2563eb", "venue");
        });

        const luckinStores = (data && data.luckin_stores) || [];
        luckinStores.forEach((store) => {
          const location = getAmapLocation(store);
          if (!location) return;
          addMarker(location, store.name || "瑞幸咖啡", "#16a34a", "luckin");
        });

        const exclusionCircle = new window.AMap.Circle({
          center: [spotLocation.lng, spotLocation.lat],
          radius: 1000,
          strokeColor: "#f97316",
          strokeWeight: 2,
          strokeOpacity: 0.9,
          strokeStyle: "dashed",
          fillColor: "#f97316",
          fillOpacity: 0.04,
          zIndex: 90,
        });
        map.add(exclusionCircle);
        currentMarkers.push(exclusionCircle);

        const nearestLuckin = group.nearest_luckin || null;
        const nearestLocation = nearestLuckin ? getAmapLocation(nearestLuckin) : null;
        if (nearestLocation) {
          const line = new window.AMap.Polyline({
            path: [
              [spotLocation.lng, spotLocation.lat],
              [nearestLocation.lng, nearestLocation.lat],
            ],
            strokeColor: "#16a34a",
            strokeWeight: 3,
            strokeOpacity: 0.9,
            strokeStyle: "dashed",
            zIndex: 180,
          });
          map.add(line);
          currentMarkers.push(line);
        }

        map.setZoomAndCenter(15, [spotLocation.lng, spotLocation.lat]);
        const nearestText =
          Number.isFinite(Number(group.nearest_luckin_distance_m))
            ? `，最近瑞幸直线距离 ${Math.round(Number(group.nearest_luckin_distance_m))} 米`
            : "";
        setMapStatus(
          `已标记热区 ${idx + 1}、1000米范围及已有瑞幸 ${luckinStores.length} 家${nearestText}。`
        );
        redrawHeatmap();
      }

      async function checkAuth() {
        if (!authToken) {
          redirectToLogin();
          return false;
        }
        try {
          const resp = await fetch(apiUrl("/auth/me"), {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          if (!resp.ok) {
            authToken = "";
            localStorage.removeItem("authToken");
            redirectToLogin();
            return false;
          }
          const data = await resp.json();
          setAuthUI(true, data.username || "");
          redirectAfterLoginIfNeeded();
          return true;
        } catch (error) {
          console.error("check_auth_failed", error);
          redirectToLogin();
          return false;
        }
      }

      async function login() {
        const username = document.getElementById("username-input").value.trim();
        const password = document.getElementById("password-input").value;
        if (!username || !password) {
          setPageMessage("请输入用户名和密码。");
          return;
        }
        try {
          const resp = await fetch(apiUrl("/auth/login"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!resp.ok) {
            setPageMessage(`登录失败：${await resp.text()}`);
            return;
          }
          const data = await resp.json();
          authToken = data.token || "";
          localStorage.setItem("authToken", authToken);
          document.getElementById("password-input").value = "";
          setAuthUI(true, data.username || username);
          setPageMessage("", false);
          if (redirectAfterLoginIfNeeded()) return;
        } catch (error) {
          console.error("login_failed", error);
          setPageMessage(`登录请求失败，请确认接口可用：${API_BASE}`);
        }
      }

      async function logout() {
        if (authToken) {
          try {
            await fetch(apiUrl("/auth/logout"), {
              method: "POST",
              headers: { Authorization: `Bearer ${authToken}` },
            });
          } catch (error) {
            console.error("logout_failed", error);
          }
        }
        authToken = "";
        localStorage.removeItem("authToken");
        setAuthUI(false);
        redirectToLogin();
      }

      function openInAmap(lat, lng, title, addr) {
        const name = encodeURIComponent(title || "选址点");
        const desc = encodeURIComponent(addr || "");
        const pos = `${lng},${lat}`;
        window.open(`https://uri.amap.com/marker?position=${pos}&name=${name}&src=luckinit&coordinate=gaode&callnative=0&content=${desc}`, "_blank");
      }

      function isLuckinName(name) {
        if (!name) return false;
        const lower = name.toLowerCase();
        return name.includes("瑞幸") || lower.includes("luckin");
      }

      function highlightSidebarItem(idx) {
        document.querySelectorAll(".hotspot-card").forEach((card) => {
          const active = Number(card.dataset.index) === idx;
          card.classList.toggle("active", active);
          if (active) {
            card.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      }

      async function focusOnHotspot(idx) {
        activeHotspotIndex = idx;
        highlightSidebarItem(idx);
        if (lastData) {
          await renderMap(lastData, idx);
        }
      }

      function renderSidebar(data) {
        const sidebar = document.getElementById("sidebar");
        const hotspots = data.hotspots || [];
        if (!hotspots.length) {
          sidebar.innerHTML =
            '<div class="hint">没有热区数据。请先分析城市，或检查后端返回。</div>';
          return;
        }

        const intro = `
          <div class="hint" style="margin-bottom:10px;">
            目标：找出“人流吸引业态多，且候选点半径 1000 米内无瑞幸”的候选热区。<br />
            最近瑞幸距离按候选点到门店的直线距离计算；点击热区后地图会自动定位。
          </div>
        `;

        sidebar.innerHTML = intro;
        hotspots.forEach((group, idx) => {
          const spot = group.spot || {};
          const venues = group.venues || [];
          const total = venues.length;
          const luckinCount = Number(group.luckin_count || 0);
          const luckinRadiusM = Number(group.luckin_radius_m || 1000);
          const nearestLuckinDistanceRaw = group.nearest_luckin_distance_m;
          const nearestLuckinDistanceM =
            nearestLuckinDistanceRaw == null ? null : Number(nearestLuckinDistanceRaw);
          const nearestLuckin = group.nearest_luckin || null;
          const officeCount = group.office_count || 0;
          const goodForLuckin = luckinCount === 0 && total >= 5;
          const catStats = {};
          venues.forEach((item) => {
            const cat = item.category || "门店";
            catStats[cat] = (catStats[cat] || 0) + 1;
          });
          const topCats = Object.entries(catStats)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(([name, count]) => `${name} ${count}家`)
            .join(" / ");

          const card = document.createElement("div");
          card.className = "hotspot-card";
          card.dataset.index = idx;

          const titleRow = document.createElement("div");
          titleRow.className = "row";

          const title = document.createElement("div");
          title.className = "hotspot-title";
          title.textContent = `热区 ${idx + 1}：${spot.name || "未命名地点"}`;

          const openBtn = document.createElement("button");
          openBtn.className = "open-btn";
          openBtn.textContent = "高德地图";
          openBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            const loc = getAmapLocation(spot);
            if (loc) {
              openInAmap(loc.lat, loc.lng, spot.name, spot.address);
            }
          });

          titleRow.appendChild(title);
          titleRow.appendChild(openBtn);

          const meta = document.createElement("div");
          meta.className = "hotspot-meta";
          const spotLoc = getAmapLocation(spot);
          const coordText = spotLoc
            ? ` | 推荐坐标 ${Number(spotLoc.lng).toFixed(6)}, ${Number(spotLoc.lat).toFixed(6)}`
            : "";
          meta.textContent = `${spot.address || "无地址信息"} | 周边店铺 ${total} 家${coordText}`;

          const sub = document.createElement("div");
          sub.className = "hotspot-subtitle";
          const nearestLuckinText =
            Number.isFinite(nearestLuckinDistanceM) && nearestLuckinDistanceM >= 0
              ? nearestLuckinDistanceM < 1000
                ? `${Math.round(nearestLuckinDistanceM)} 米（直线）`
                : `${(nearestLuckinDistanceM / 1000).toFixed(2)} 公里（直线）`
              : "未检索到";
          const nearestLuckinName =
            nearestLuckin && nearestLuckin.name ? ` · ${nearestLuckin.name}` : "";
          sub.innerHTML =
            `主力业态：${topCats || "暂无"} ` +
            `<span class="small-tag">${Math.round(luckinRadiusM)}m内瑞幸 ${luckinCount} 家</span>` +
            `<span class="small-tag">最近瑞幸 ${nearestLuckinText}${nearestLuckinName}</span>` +
            `<span class="small-tag">办公 ${officeCount} 处</span>` +
            (goodForLuckin
              ? '<span class="small-tag tag-good">1km内无瑞幸</span>'
              : luckinCount > 0
              ? '<span class="small-tag tag-risk">1km内已有瑞幸</span>'
              : "");

          card.appendChild(titleRow);
          card.appendChild(meta);
          card.appendChild(sub);

          if (total > 0) {
            const poiList = document.createElement("ul");
            poiList.className = "poi-list";
            venues.slice(0, 6).forEach((item) => {
              const li = document.createElement("li");
              li.textContent =
                `${isLuckinName(item.name) ? "瑞幸" : "门店"} ` +
                `${item.category ? item.category + " / " : ""}` +
                `${item.name || "未命名店铺"}`;
              poiList.appendChild(li);
            });
            card.appendChild(poiList);
          }

          card.addEventListener("click", () => {
            focusOnHotspot(idx);
          });

          sidebar.appendChild(card);
        });
      }

      async function fetchAnalyzeCityData(city, refresh = false) {
        const suffix = refresh ? "&refresh=true" : "";
        const resp = await fetch(
          apiUrl(`/analyze_city?city=${encodeURIComponent(city)}${suffix}`),
          {
            headers: { Authorization: `Bearer ${authToken}` },
          }
        );

        if (!resp.ok) {
          const text = await resp.text();
          return { ok: false, status: resp.status, text };
        }

        const data = await resp.json();
        return { ok: true, data };
      }

      async function loadData() {
        if (!authToken) {
          setPageMessage("请先登录。");
          return;
        }
        const city = document.getElementById("city-select").value;
        if (!city) {
          setPageMessage("请选择城市。");
          return;
        }

        try {
          setPageMessage("", false);
          setMapStatus("正在分析城市并加载高德地图...");
          let result = await fetchAnalyzeCityData(city, false);

          let data = null;
          let usedAmapFallback = false;

          if (!result.ok) {
            if (result.status === 401) {
              await logout();
              setPageMessage("登录已失效，请重新登录。");
              return;
            }
            setPageMessage("Overpass 不可用，正在自动切换高德 POI 数据...", false);
            data = await buildAmapFallbackData(city);
            usedAmapFallback = true;
          } else {
            data = result.data;
          }
          if (!((data && data.hotspots) || []).length && !usedAmapFallback) {
            setMapStatus("Overpass 未返回有效热区，正在切换高德 POI 数据...");
            data = await buildAmapFallbackData(city);
            usedAmapFallback = true;
          }

          data = await enrichWithAmapLuckin(data, city);

          if (!((data && data.hotspots) || []).length) {
            setPageMessage("高德与 Overpass 均未生成有效候选热区。");
            setMapStatus("暂无可用候选热区。");
            return;
          }

          lastData = data;
          activeHotspotIndex = 0;

          await ensureMapReady();
          const cityView = CITY_VIEW[city] || CITY_VIEW.Huizhou;
          const center = cityView.center;

          const hotspots = data.hotspots || [];
          const points = [];
          hotspots.forEach((h) => {
            const spotLoc = getAmapLocation(h.spot);
            if (spotLoc) points.push([spotLoc.lng, spotLoc.lat]);
            (h.venues || []).forEach((v) => {
              const venueLoc = getAmapLocation(v);
              if (venueLoc) points.push([venueLoc.lng, venueLoc.lat]);
            });
          });

          if (points.length > 0) {
            map.setFitView();
            map.setBounds(
              new window.AMap.Bounds(
                points.reduce(
                  (min, p) => [Math.min(min[0], p[0]), Math.min(min[1], p[1])],
                  [points[0][0], points[0][1]]
                ),
                points.reduce(
                  (max, p) => [Math.max(max[0], p[0]), Math.max(max[1], p[1])],
                  [points[0][0], points[0][1]]
                )
              )
            );
            map.setCenter(center);
          } else {
            map.setZoomAndCenter(cityView.zoom, center);
          }

          renderSidebar(data);
          highlightSidebarItem(activeHotspotIndex);
          await renderMap(data, activeHotspotIndex || 0);
          if (!hotspots.length) {
            setPageMessage("未找到热区数据，已尝试重新计算，但后端仍返回空结果。");
            setMapStatus("未找到热区数据，请检查后端 Overpass 返回。");
            return;
          }
          setPageMessage(
            usedAmapFallback
              ? "分析完成：Overpass 不可用，已自动使用高德 POI 数据；同时显示已有瑞幸门店。"
              : "分析完成：已显示推荐热区、已有瑞幸门店、1000米范围和最近瑞幸直线距离。",
            false
          );
        } catch (error) {
          console.error("analyze_failed", error);
          setPageMessage(
            `分析失败：${error && error.message ? error.message : String(error)}`
          );
          setMapStatus("高德地图加载失败。");
        }
      }

      function toggleHeatmap(show) {
        if (!show) {
          clearHeatmap();
          setPageMessage("已关闭热力图。", false);
          return;
        }
        if (!lastData || !currentHeatGroup) {
          setPageMessage("请先完成分析。");
          document.getElementById("heatmap-toggle").checked = false;
          return;
        }
        redrawHeatmap();
        setPageMessage("热力图已开启。", false);
      }

      document.querySelectorAll('[data-role="toggle-filters"]').forEach((btn) => {
        btn.addEventListener("click", () => toggleFilters());
      });
      if ((localStorage.getItem("cityAnalysisFiltersCollapsed") || "") === "1") {
        document.body.classList.add("filters-collapsed");
      }
      applyFilterCollapseUI();
      document.getElementById("api-base-label").textContent = `接口：${API_BASE}`;
      checkAuth();
      ensureMapReady().catch((error) => {
        console.error("init_map_failed", error);
        setMapStatus(
          `高德地图初始化失败：${error && error.message ? error.message : String(error)}`
        );
      });
    </script>
  </body>
