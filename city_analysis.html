      function brandPriorityWeight(index, total) {
        if (total <= 1) return 10;
        return Number((10 - (index * 6) / (total - 1)).toFixed(2));

      function resolveApiBase() {
        const fromQuery = (PAGE_PARAMS.get("apiBase") || "").trim();
        if (fromQuery) return fromQuery.replace(/\/+$/, "");
        const fromStorage = (localStorage.getItem("apiBase") || "").trim();
        if (fromStorage) return fromStorage.replace(/\/+$/, "");
        if (window.location.protocol === "file:") return "http://127.0.0.1:8008";
        return window.location.origin.replace(/\/+$/, "");
      }

        const next = (PAGE_PARAMS.get("next") || "").trim();
        return next.startsWith("/") ? next : "";

      function proxiedAmapUrl(src, assetType = "asset") {
        try {
          const url = new URL(src, window.location.href);
          const hostname = (url.hostname || "").toLowerCase();
          const isAmapScriptHost = hostname === "webapi.amap.com";
          const isAmapTileHost =
            hostname.endsWith(".is.autonavi.com") &&
            /^(webrd0|wprd0|webst0)/.test(hostname);

          if (!isAmapScriptHost && !isAmapTileHost) return src;

          const proxyPath =
            assetType === "script" ? "/proxy/remote-script?url=" : "/proxy/remote-asset?url=";
          return `${API_BASE}${proxyPath}${encodeURIComponent(url.href)}`;
        } catch (error) {
          return src;
        }
      }

      function patchAmapAssetProxy() {
        if (mapSdkPatched) return;
        mapSdkPatched = true;

        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function patchedSetAttribute(name, value) {
          if (
            typeof value === "string" &&
            (name === "src" || name === "href") &&
            this &&
            (this.tagName === "SCRIPT" || this.tagName === "IMG")
          ) {
            const assetType = this.tagName === "SCRIPT" ? "script" : "asset";
            value = proxiedAmapUrl(value, assetType);
          }
          return originalSetAttribute.call(this, name, value);
        };

        const imageSrcDescriptor = Object.getOwnPropertyDescriptor(
          HTMLImageElement.prototype,
          "src"
        );
        if (imageSrcDescriptor && imageSrcDescriptor.set) {
          Object.defineProperty(HTMLImageElement.prototype, "src", {
            configurable: true,
            enumerable: imageSrcDescriptor.enumerable,
            get: imageSrcDescriptor.get,
            set(value) {
              return imageSrcDescriptor.set.call(this, proxiedAmapUrl(value, "asset"));
            },
          });
        }
      }

      function buildAmapTileUrl(x, y, z) {
        const rawUrl =
          `https://webrd01.is.autonavi.com/appmaptile?` +
          `lang=zh_cn&size=1&scale=1&style=7&x=${x}&y=${y}&z=${z}`;
        return proxiedAmapUrl(rawUrl, "asset");
      }

      function loadAmapSdk() {
        if (window.AMap && typeof window.AMap.Map === "function") {
          return Promise.resolve();
        }
        if (mapReadyPromise) return mapReadyPromise;

        patchAmapAssetProxy();
        const sdkUrl =
          `${API_BASE}/proxy/remote-script?url=` +
          encodeURIComponent(`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}`);

        mapReadyPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = sdkUrl;
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("amap_sdk_loader_failed"));
          document.head.appendChild(script);
        })
          .then(() => {
            if (!window.AMap || typeof window.AMap.Map !== "function") {
              throw new Error("AMap unavailable after load");
            }
          })
          .catch((error) => {
            mapReadyPromise = null;
            throw error;
          });

        return mapReadyPromise;
      }

      function getSafeZoom(defaultZoom = 11) {
        if (!map || typeof map.getZoom !== "function") return defaultZoom;
        const zoom = Number(map.getZoom());
        return Number.isFinite(zoom) ? zoom : defaultZoom;
      }

      function resizeHeatCanvas() {
        const shell = document.getElementById("map-shell");
        const canvas = document.getElementById("heatmap-canvas");
        const width = shell.clientWidth;
        const height = shell.clientHeight;
        if (!width || !height) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clearHeatmap() {
        const canvas = document.getElementById("heatmap-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function getAmapLocation(item) {
        return item?.location_gcj02 || item?.location || null;
      }

      function getLngLatNumbers(location) {
        if (!location) return null;
        const lng =
          typeof location.getLng === "function" ? Number(location.getLng()) : Number(location.lng);
        const lat =
          typeof location.getLat === "function" ? Number(location.getLat()) : Number(location.lat);
        if (!Number.isFinite(lng) || !Number.isFinite(lat)) return null;
        return { lng, lat };
      }

      function haversineDistanceM(a, b) {
        if (!a || !b) return Infinity;
        const R = 6371000;
        const toRad = (deg) => (deg * Math.PI) / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const lat1 = toRad(a.lat);
        const lat2 = toRad(b.lat);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      function dedupePlaces(items) {
        const seen = new Set();
        const output = [];
        (items || []).forEach((item) => {
          const loc = getAmapLocation(item);
          if (!loc) return;
          const key =
            item.id ||
            `${item.name || ""}|${Number(loc.lng).toFixed(5)}|${Number(loc.lat).toFixed(5)}`;
          if (seen.has(key)) return;
          seen.add(key);
          output.push(item);
        });
        return output;
      }

      function bd09ToGcj02Point(lat, lon) {
        const x = lon - 0.0065;
        const y = lat - 0.006;
        const z =
          Math.sqrt(x * x + y * y) -
          0.00002 * Math.sin((y * Math.PI * 3000.0) / 180.0);
        const theta =
          Math.atan2(y, x) -
          0.000003 * Math.cos((x * Math.PI * 3000.0) / 180.0);
        return {
          lng: z * Math.cos(theta),
          lat: z * Math.sin(theta),
        };
      }

      function gcj02ToBd09Point(lat, lon) {
        const x = lon;
        const y = lat;
        const z =
          Math.sqrt(x * x + y * y) +
          0.00002 * Math.sin((y * Math.PI * 3000.0) / 180.0);
        const theta =
          Math.atan2(y, x) +
          0.000003 * Math.cos((x * Math.PI * 3000.0) / 180.0);
        return {
          lng: z * Math.cos(theta) + 0.0065,
          lat: z * Math.sin(theta) + 0.006,
        };
      }

      async function loadBaiduSdk() {
        if (
          window.BMap &&
          typeof window.BMap.LocalSearch === "function" &&
          typeof window.BMap.Point === "function"
        ) {
          return;
        }
        if (baiduReadyPromise) return baiduReadyPromise;

        baiduReadyPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = apiUrl("/proxy/baidu/getscript?v=3.0&services=");
          script.async = true;
          script.onload = () => {
            if (
              window.BMap &&
              typeof window.BMap.LocalSearch === "function" &&
              typeof window.BMap.Point === "function"
            ) {
              resolve();
            } else {
              reject(new Error("Baidu SDK loaded but BMap.LocalSearch unavailable"));
            }
          };
          script.onerror = () => reject(new Error("baidu_sdk_loader_failed"));
          document.head.appendChild(script);
        }).catch((error) => {
          baiduReadyPromise = null;
          throw error;
        });

        return baiduReadyPromise;
      }

      async function baiduSearchKeyword(
        city,
        keyword,
        category,

              finish();
            }, 15000);
          };

          try {

              pageCapacity: 50,

                armTimeout();

                if (
                  !results ||
                  typeof results.getCurrentNumPois !== "function" ||
                  typeof results.getPoi !== "function"
                ) {
                  finish();
                  return;
                }

                const count = Number(results.getCurrentNumPois() || 0);

                    },
                  });

                const reportedPages =
                  typeof results.getNumPages === "function"
                    ? Number(results.getNumPages() || 1)
                    : 1;
                pageLimit = Math.max(
                  1,
                  Math.min(Number(maxPages) || 1, reportedPages || 1)
                );

                if (
                  nextPageIndex < pageLimit &&
                  typeof local.gotoPage === "function"
                ) {
                  const pageToLoad = nextPageIndex;
                  nextPageIndex += 1;
                  try {
                    local.gotoPage(pageToLoad);
                    return;

                    console.warn(
                      "baidu_goto_page_failed",
                      city,
                      keyword,
                      pageToLoad,
                      error

                  }
                }

                finish();
              },
            });

            armTimeout();
            local.search(keyword);

            console.warn("baidu_search_failed", city, keyword, error);
            finish();
          }
        });

      async function runInBatches(taskFactories, batchSize = 5) {
        const output = [];
        for (let i = 0; i < taskFactories.length; i += batchSize) {
          const batch = taskFactories.slice(i, i + batchSize);
          const settled = await Promise.all(
            batch.map(async (factory) => {
              try {
                return await factory();
              } catch (error) {
                console.warn("batched_task_failed", error);
                return [];
              }
            })
          );
          output.push(...settled);
        }
        return output;
      }

      function applyBrandSignalMetrics(data, brandPois) {
        data.brand_pois = dedupePlaces(brandPois);
        (data.hotspots || []).forEach((group) => {
          const spotLoc = getAmapLocation(group.spot);
          if (!spotLoc) return;

          const nearby = data.brand_pois
            .map((poi) => ({
              poi,
              distance: haversineDistanceM(spotLoc, getAmapLocation(poi)),
            }))
            .filter(
              (item) =>
                Number.isFinite(item.distance) &&
                item.distance <= BRAND_SCAN_RADIUS_M
            )
            .sort((a, b) => a.distance - b.distance);

          const groupCounts = { competitor: 0, similar: 0, coexist: 0 };
          const brandCountMap = {};
          nearby.forEach(({ poi }) => {
            if (groupCounts[poi.brand_group] != null) {
              groupCounts[poi.brand_group] += 1;
            }
            brandCountMap[poi.brand] = (brandCountMap[poi.brand] || 0) + 1;
          });

          const matchedBrands = BRAND_DEFINITIONS.filter(
            (definition) => brandCountMap[definition.name]
          ).map((definition) => ({
            name: definition.name,
            group: definition.groupKey,
            group_label: definition.groupLabel,
            rank: definition.rank,
            weight: definition.weight,
            count: brandCountMap[definition.name],
          }));

          const brandSignalScore = matchedBrands.reduce(
            (sum, item) => sum + item.weight,
            0
          );
          const baseScore = Number(group.spot?.hot_score || group.hot_score || 0);
          const priorityScore = Number(
            (baseScore + brandSignalScore * 2).toFixed(1)
          );

          group.brand_scan_radius_m = BRAND_SCAN_RADIUS_M;
          group.brand_counts = groupCounts;
          group.brand_matches = matchedBrands;
          group.brand_signal_score = Number(brandSignalScore.toFixed(1));
          group.priority_score = priorityScore;
          group.brand_pois_nearby = nearby.map(({ poi, distance }) => ({
            ...poi,
            distance_m: Math.round(distance),
          }));
        });

        data.hotspots = (data.hotspots || []).sort(
          (a, b) =>
            Number(b.priority_score || b.spot?.hot_score || 0) -
            Number(a.priority_score || a.spot?.hot_score || 0)
        );
        return data;
      }

      function getLuckinStoreSources(store) {
        if (Array.isArray(store?.sources) && store.sources.length) {
          return store.sources;
        }
        const source = String(store?.tags?.source || "").toLowerCase();
        if (source.includes("baidu")) return ["baidu"];
        if (source.includes("amap")) return ["amap"];
        return ["other"];
      }

      function mergeLuckinStoreList(stores, thresholdM = 120) {
        const merged = [];
        (stores || []).forEach((store) => {
          const storeLoc = getAmapLocation(store);
          if (!storeLoc) return;

          let best = null;
          let bestDistance = Infinity;
          merged.forEach((candidate) => {
            const candidateLoc = getAmapLocation(candidate);
            if (!candidateLoc) return;
            const distance = haversineDistanceM(candidateLoc, storeLoc);
            if (distance < bestDistance) {
              bestDistance = distance;
              best = candidate;
            }
          });

          if (best && bestDistance <= thresholdM) {
            best.sources = Array.from(
              new Set([
                ...getLuckinStoreSources(best),
                ...getLuckinStoreSources(store),
              ])
            );
            best.dual_source_confirmed =
              best.sources.includes("amap") &&
              best.sources.includes("baidu");
            if (!best.address && store.address) best.address = store.address;
            if (!best.location_bd09 && store.location_bd09) {
              best.location_bd09 = store.location_bd09;
            }
          } else {
            const copy = {
              ...store,
              sources: getLuckinStoreSources(store),
            };
            copy.dual_source_confirmed =
              copy.sources.includes("amap") &&
              copy.sources.includes("baidu");
            merged.push(copy);
          }
        });
        return merged;
      }

      function mergeLuckinStores(amapStores, baiduStores) {
        const taggedAmap = (amapStores || []).map((store) => ({
          ...store,
          sources: Array.from(
            new Set([...getLuckinStoreSources(store).filter((s) => s !== "other"), "amap"])
          ),
        }));
        const taggedBaidu = (baiduStores || []).map((store) => ({
          ...store,
          sources: Array.from(
            new Set([...getLuckinStoreSources(store).filter((s) => s !== "other"), "baidu"])
          ),
        }));
        return mergeLuckinStoreList([...taggedAmap, ...taggedBaidu]);
      }

      async function validateCandidateLuckin(city, group, globalStores) {
        const spotLoc = getAmapLocation(group.spot);
        if (!spotLoc) {
          group.luckin_validation_status = "unknown";
          group.luckin_count = null;
          group.recommendation_status = "review";
          return [];
        }

        const centerBd09 =
          group.spot?.location_bd09 ||
          gcj02ToBd09Point(spotLoc.lat, spotLoc.lng);

        const [amapProbe, baiduProbe] = await Promise.all([
          probeAmapLuckinNearby(city, spotLoc, 1000),
          probeBaiduLuckinNearby(city, centerBd09, 1000),
        ]);

        const probeStores = mergeLuckinStores(
          amapProbe.stores || [],
          baiduProbe.stores || []
        );
        const allKnownStores = mergeLuckinStoreList([
          ...(globalStores || []),
          ...probeStores,
        ]);

        const distances = allKnownStores
          .map((store) => ({
            store,
            distance: haversineDistanceM(
              spotLoc,
              getAmapLocation(store)
            ),
          }))
          .filter((item) => Number.isFinite(item.distance))
          .sort((a, b) => a.distance - b.distance);

        const within1000 = distances.filter(
          (item) => item.distance <= 1000
        );
        const nearest = distances[0] || null;

        let validationStatus = "unknown";
        if (within1000.length > 0) {
          validationStatus = "found";
        } else if (amapProbe.ok && baiduProbe.ok) {
          validationStatus = "clear";
        }

        group.luckin_radius_m = 1000;
        group.luckin_validation_status = validationStatus;
        group.luckin_validation_sources = {
          amap: {
            ok: Boolean(amapProbe.ok),
            count: (amapProbe.stores || []).length,
            reason: amapProbe.reason || "",
          },
          baidu: {
            ok: Boolean(baiduProbe.ok),
            count: (baiduProbe.stores || []).length,
            reason: baiduProbe.reason || "",
          },
        };
        group.luckin_count =
          validationStatus === "unknown" ? null : within1000.length;
        group.recommendation_status =
          validationStatus === "found"
            ? "blocked"
            : validationStatus === "clear"
            ? "eligible"
            : "review";
        group.eligible_for_luckin = validationStatus === "clear";
        group.nearest_luckin_distance_m = nearest
          ? Math.round(nearest.distance)
          : null;
        group.nearest_luckin = nearest
          ? {
              name: nearest.store.name || "瑞幸咖啡",
              address: nearest.store.address || "",
              distance_m: Math.round(nearest.distance),
              distance_type: "straight_line",
              location: getAmapLocation(nearest.store),
              location_gcj02: getAmapLocation(nearest.store),
              location_bd09: nearest.store.location_bd09 || null,
              sources: getLuckinStoreSources(nearest.store),
              dual_source_confirmed: Boolean(
                nearest.store.dual_source_confirmed
              ),
            }
          : null;

        return probeStores;
      }

      async function validateAllCandidateLuckin(data, city) {
        const hotspots = data.hotspots || [];
        if (!hotspots.length) return data;

        const discovered = [];
        const batchSize = 3;
        for (let i = 0; i < hotspots.length; i += batchSize) {
          const batch = hotspots.slice(i, i + batchSize);
          setMapStatus(
            `正在逐点校验1000米瑞幸：${Math.min(
              i + batch.length,
              hotspots.length
            )}/${hotspots.length}`
          );
          const results = await Promise.all(
            batch.map(async (group) => {
              try {
                return await validateCandidateLuckin(
                  city,
                  group,
                  data.luckin_stores || []
                );
              } catch (error) {
                console.warn("candidate_luckin_validation_failed", error);
                group.luckin_validation_status = "unknown";
                group.luckin_count = null;
                group.recommendation_status = "review";
                group.eligible_for_luckin = false;
                return [];
              }
            })
          );
          results.forEach((stores) => discovered.push(...stores));
        }

        data.luckin_stores = mergeLuckinStoreList([
          ...(data.luckin_stores || []),
          ...discovered,
        ]);

        const statusRank = {
          eligible: 0,
          review: 1,
          blocked: 2,
        };
        hotspots.sort((a, b) => {
          const statusDiff =
            (statusRank[a.recommendation_status] ?? 1) -
            (statusRank[b.recommendation_status] ?? 1);
          if (statusDiff !== 0) return statusDiff;
          return (
            Number(b.priority_score || b.spot?.hot_score || 0) -
            Number(a.priority_score || a.spot?.hot_score || 0)
          );
        });

        const summary = {
          clear: 0,
          found: 0,
          unknown: 0,
        };
        hotspots.forEach((group) => {
          const key = group.luckin_validation_status || "unknown";
          if (summary[key] == null) summary[key] = 0;
          summary[key] += 1;
        });
        data.luckin_validation_summary = summary;
        return data;
      }

      function selectCandidateSpread(
        groups,
        limit = 50,
        townshipQuota = 20
      ) {
        const sorted = [...(groups || [])].sort(
          (a, b) => (b.spot?.hot_score || 0) - (a.spot?.hot_score || 0)
        );
        const township = sorted.filter(
          (group) => group.spot?.anchor_category === "乡镇"
        );
        const nonTownship = sorted.filter(
          (group) => group.spot?.anchor_category !== "乡镇"
        );
        const selected = [];

        const canAdd = (group, minDistanceM) => {
          const loc = getAmapLocation(group.spot);
          if (!loc) return false;
          return !selected.some((chosen) => {
            const chosenLoc = getAmapLocation(chosen.spot);
            return (
              chosenLoc &&
              haversineDistanceM(loc, chosenLoc) < minDistanceM
            );
          });
        };

        const take = (pool, maxTownshipCount, minDistanceM) => {
          for (const group of pool) {
            if (selected.length >= limit) break;
            if (selected.includes(group)) continue;
            const townshipSelected = selected.filter(
              (item) => item.spot?.anchor_category === "乡镇"
            ).length;
            if (
              maxTownshipCount != null &&
              group.spot?.anchor_category === "乡镇" &&
              townshipSelected >= maxTownshipCount
            ) {
              continue;
            }
            if (!canAdd(group, minDistanceM)) continue;
            selected.push(group);
          }
        };

        // Keep township coverage before the hard 1km Luckin validation.
        take(township, Math.min(townshipQuota, township.length), 350);
        take(nonTownship, null, 450);
        take(sorted, null, 350);

        return selected.slice(0, limit);
      }

      async function buildBaiduFallbackData(city) {
        setMapStatus("高德 POI 未生成候选点，正在切换百度 POI 数据分析...");

        const anchorDefs = [
          ["购物中心", "商场"],
          ["商场", "商场"],
          ["商业广场", "商圈"],
          ["写字楼", "写字楼"],
          ["大学", "大学"],
          ["火车站", "交通"],
          ["大型超市", "超市"],
          ["镇政府", "乡镇"],
          ["乡政府", "乡镇"],
          ["街道办事处", "街道"],
        ];
        const attractorDefs = [
          ["餐饮", "餐饮"],
          ["咖啡", "咖啡"],
          ["奶茶", "奶茶"],
          ["便利店", "便利店"],
          ["超市", "超市"],
          ["写字楼", "写字楼"],
          ["大学", "大学"],
        ];

        const anchorResults = await runInBatches(
          anchorDefs.map(
            ([keyword, category]) =>
              () => baiduSearchKeyword(city, keyword, category, 3)
          ),
          2
        );
        await sleep(250);
        const attractorResults = await runInBatches(
          attractorDefs.map(
            ([keyword, category]) =>
              () => baiduSearchKeyword(city, keyword, category, 3)
          ),
          2
        );

        let anchors = dedupePlaces(anchorResults.flat());
        let attractors = dedupePlaces(attractorResults.flat());

        if (!anchors.length) anchors = attractors.slice(0, 80);

        const townshipAnchors = anchors
          .filter((item) => item.category === "乡镇" && item.location_bd09)
          .slice(0, 60);

        if (townshipAnchors.length) {
          setMapStatus(
            `百度已发现 ${townshipAnchors.length} 个乡镇锚点，正在补充乡镇商业扫描...`
          );
          const townshipTasks = townshipAnchors.map(
            (anchor) => async () =>
              baiduSearchNearbyKeyword(
                city,
                "餐饮",
                "乡镇餐饮",
                anchor.location_bd09,
                3000
              )
          );
          const townshipResults = await runInBatches(townshipTasks, 5);
          attractors = dedupePlaces([
            ...attractors,
            ...townshipResults.flat(),
          ]);
        }

        const groups = [];
        anchors.forEach((anchor) => {
          const anchorLoc = getAmapLocation(anchor);
          if (!anchorLoc) return;
          const nearby = attractors
            .map((place) => ({
              place,
              distance: haversineDistanceM(
                anchorLoc,
                getAmapLocation(place)
              ),
            }))
            .filter(
              (item) =>
                Number.isFinite(item.distance) && item.distance <= 1200
            )
            .sort((a, b) => a.distance - b.distance)
            .map((item) => item.place);

          if (!nearby.length) return;
          const officeCount = nearby.filter(
            (item) => item.category === "写字楼"
          ).length;
          groups.push({
            spot: {
              name: anchor.name,
              address: anchor.address || "",
              anchor_category: anchor.category || "",
              location: anchorLoc,
              location_gcj02: anchorLoc,
              location_bd09: anchor.location_bd09 || null,
              coord_type: "gcj02",
              hot_score: nearby.length,
            },
            venues: nearby.slice(0, 80),
            office_count: officeCount,
          });
        });

        const spread = selectCandidateSpread(groups, 50, 20);
        const townshipCandidateCount = spread.filter(
          (group) => group.spot?.anchor_category === "乡镇"
        ).length;

        let luckinStores = [];
        let brandPois = [];
        if (spread.length) {
          const enrichment = await Promise.allSettled([
            fetchBaiduLuckinStores(city),
            fetchBaiduBrandSignals(city),
          ]);
          if (enrichment[0].status === "fulfilled") {
            luckinStores = enrichment[0].value || [];
          }
          if (enrichment[1].status === "fulfilled") {
            brandPois = enrichment[1].value || [];
          }
        }

        let payload = applyLuckinMetrics(
          {
            city,
            source: "baidu_fallback",
            source_diagnostics: {
              baidu: {
                anchor_count: anchors.length,
                attractor_count: attractors.length,
                group_count: groups.length,
                candidate_count: spread.length,
              },
            },
            scan_meta: {
              township_anchor_count: townshipAnchors.length,
              township_candidate_count: townshipCandidateCount,
              candidate_pool_count: spread.length,
              scan_scope: "prefecture_city_including_townships",
            },
            hotspots: spread,
          },
          luckinStores
        );
        payload = applyBrandSignalMetrics(payload, brandPois);
        return payload;
      }

      async function fetchAmapLuckinStores(city) {
        const results = await Promise.all([
          amapSearchKeyword(city, "瑞幸咖啡", "瑞幸", 4),
          amapSearchKeyword(city, "luckin coffee", "瑞幸", 2),
        ]);
        return dedupePlaces(results.flat()).filter((item) => isLuckinName(item.name));
      }

      function applyLuckinMetrics(data, luckinStores) {
        data.luckin_stores = dedupePlaces(luckinStores);
        (data.hotspots || []).forEach((group) => {
          const spotLoc = getAmapLocation(group.spot);
          if (!spotLoc) return;
          const distances = data.luckin_stores
            .map((store) => ({
              store,
              distance: haversineDistanceM(spotLoc, getAmapLocation(store)),
            }))
            .filter((item) => Number.isFinite(item.distance))
            .sort((a, b) => a.distance - b.distance);

          const nearest = distances[0] || null;
          group.luckin_radius_m = 1000;
          group.luckin_count = distances.filter((item) => item.distance <= 1000).length;
          group.nearest_luckin_distance_m = nearest ? Math.round(nearest.distance) : null;
          group.nearest_luckin = nearest
            ? {
                name: nearest.store.name,
                address: nearest.store.address || "",
                distance_m: Math.round(nearest.distance),
                distance_type: "straight_line",
                location: getAmapLocation(nearest.store),
                location_gcj02: getAmapLocation(nearest.store),
              }
            : null;
        });
        return data;
      }

        ).length;

        let luckinStores = [];

        if (spread.length) {

          if (enrichment[0].status === "fulfilled") {

              candidate_pool_count: spread.length,

      async function enrichWithAmapMarketSignals(data, city) {
        try {
          const [luckinStores, brandPois] = await Promise.all([
            fetchAmapLuckinStores(city),
            fetchAmapBrandSignals(city),
          ]);
          if (luckinStores.length) {
            data = applyLuckinMetrics(data, luckinStores);
          }
          data = applyBrandSignalMetrics(data, brandPois);
          return data;
        } catch (error) {
          console.warn("amap_market_signal_enrich_failed", error);
          return data;
        }
      }

      async function enrichWithBaiduMarketSignals(data, city) {
        try {
          const [baiduLuckinStores, baiduBrandPois] = await Promise.all([
            fetchBaiduLuckinStores(city),
            fetchBaiduBrandSignals(city),
          ]);

          const currentLuckinStores = data.luckin_stores || [];
          const mergedLuckinStores = mergeLuckinStores(
            currentLuckinStores,
            baiduLuckinStores
          );
          if (mergedLuckinStores.length) {
            data = applyLuckinMetrics(data, mergedLuckinStores);
          }

          const mergedBrandPois = dedupePlaces([
            ...(data.brand_pois || []),
            ...baiduBrandPois,
          ]);
          data = applyBrandSignalMetrics(data, mergedBrandPois);
          data.source_calibration = {
            ...(data.source_calibration || {}),
            baidu: true,
            baidu_luckin_count: baiduLuckinStores.length,
            dual_source_luckin_count: mergedLuckinStores.filter(
              (item) => item.dual_source_confirmed
            ).length,
          };
          return data;
        } catch (error) {
          console.warn("baidu_market_signal_enrich_failed", error);
          data.source_calibration = {
            ...(data.source_calibration || {}),
            baidu: false,
          };
          return data;
        }
      }

      function drawHeatmapForGroup(group) {
        if (!map || !group) {
          clearHeatmap();
          return;
        }

        resizeHeatCanvas();
        const canvas = document.getElementById("heatmap-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const venues = (group.venues || []).filter((item) => {
          const location = getAmapLocation(item);
          return (
            location &&
            Number.isFinite(location.lng) &&
            Number.isFinite(location.lat)
          );
        });

        venues.forEach((place) => {
          const location = getAmapLocation(place);
          const pixel = map.lngLatToContainer([location.lng, location.lat]);
          if (!pixel) return;
          const radius = Math.max(28, Math.min(84, getSafeZoom() * 4.5));
          const gradient = ctx.createRadialGradient(
            pixel.x,
            pixel.y,
            0,
            pixel.x,
            pixel.y,
            radius
          );
          gradient.addColorStop(0, "rgba(255, 87, 34, 0.35)");
          gradient.addColorStop(0.45, "rgba(255, 152, 0, 0.22)");
          gradient.addColorStop(1, "rgba(255, 193, 7, 0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(pixel.x, pixel.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function redrawHeatmap() {
        if (!document.getElementById("heatmap-toggle").checked) {
          clearHeatmap();
          return;
        }
        drawHeatmapForGroup(currentHeatGroup);
      }

      function buildMarkerContent(type, color) {
        const isHotspot = type === "hotspot";
        const isLuckin = type === "luckin";
        const size = isHotspot ? 34 : isLuckin ? 28 : 20;
        const stroke = isHotspot ? 4 : isLuckin ? 3 : 3;
        const center = size / 2;
        const radius = isHotspot ? 8 : isLuckin ? 7 : 5;
        const ringRadius = isHotspot ? 14 : isLuckin ? 11 : 8;
        return `
          <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${center}" cy="${center}" r="${ringRadius}" fill="${color}" fill-opacity="${isHotspot ? 0.18 : isLuckin ? 0.22 : 0.14}" />
            <circle cx="${center}" cy="${center}" r="${radius}" fill="${color}" stroke="white" stroke-width="${stroke}" />
          </svg>
        `;
      }

      function addMarker(location, title, color, type = "venue") {
        const marker = new window.AMap.Marker({
          position: [location.lng, location.lat],
          offset: new window.AMap.Pixel(
            type === "hotspot" ? -17 : type === "luckin" ? -14 : -10,
            type === "hotspot" ? -17 : type === "luckin" ? -14 : -10
          ),
          content: buildMarkerContent(type, color),
          title: title || "",
          anchor: "center",
          zIndex: type === "hotspot" ? 220 : type === "luckin" ? 200 : 120,
        });

        if (type === "hotspot") {
          marker.setLabel({
            direction: "right",
            offset: new window.AMap.Pixel(16, -18),
            content: `<div style="color:#9a3412;border:1px solid rgba(234,88,12,0.25);background:rgba(255,255,255,0.95);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,0.12);">${title || "候选热区"}</div>`,
          });
        }

        map.add(marker);
        currentMarkers.push(marker);
        return marker;
      }

      async function ensureMapReady() {
        if (map) return map;
        await loadAmapSdk();

        map = new window.AMap.Map("map", {
          zoom: 11,
          center: [116.3974, 39.9093],
          viewMode: "2D",
          resizeEnable: true,
        });

        baseTileLayer = new window.AMap.TileLayer({
          zIndex: 1,
          opacity: 1,
          tileSize: 256,
          getTileUrl(x, y, z) {
            return buildAmapTileUrl(x, y, z);
          },
        });
        map.setLayers([baseTileLayer]);

        map.on("moveend", redrawHeatmap);
        map.on("zoomend", redrawHeatmap);
        window.addEventListener("resize", () => {
          if (!map) return;
          map.resize();
          redrawHeatmap();
        });

        setMapStatus("高德动态地图已就绪。");
        return map;
      }

      function clearMarkers() {
        if (!map) return;
        if (currentMarkers.length) {
          map.remove(currentMarkers);
        }
        currentMarkers = [];
      }

      async function renderMap(data, idx = 0) {
        const hotspots = (data && data.hotspots) || [];
        const group = hotspots[idx] || hotspots[0];
        if (!group || !group.spot) {
          setMapStatus("没有可显示的地图数据。");
          clearMarkers();
          clearHeatmap();
          return;
        }

        await ensureMapReady();
        activeHotspotIndex = idx;
        currentHeatGroup = group;
        clearMarkers();

        const spot = group.spot;
        const spotLocation = getAmapLocation(spot);
        const venues = group.venues || [];
        if (!spotLocation) {
          setMapStatus("热区缺少可用坐标。");
          return;
        }

        addMarker(spotLocation, spot.name || "候选热区", "#f97316", "hotspot");

        venues.slice(0, 60).forEach((place) => {
          const location = getAmapLocation(place);
          if (!location) return;
          addMarker(location, place.name || place.category || "门店", "#2563eb", "venue");
        });

        const luckinStores = (data && data.luckin_stores) || [];
        luckinStores.forEach((store) => {
          const location = getAmapLocation(store);
          if (!location) return;
          addMarker(location, store.name || "瑞幸咖啡", "#16a34a", "luckin");
        });

        const exclusionCircle = new window.AMap.Circle({
          center: [spotLocation.lng, spotLocation.lat],
          radius: 1000,
          strokeColor: "#f97316",
          strokeWeight: 2,
          strokeOpacity: 0.9,
          strokeStyle: "dashed",
          fillColor: "#f97316",
          fillOpacity: 0.04,
          zIndex: 90,
        });
        map.add(exclusionCircle);
        currentMarkers.push(exclusionCircle);

        const nearestLuckin = group.nearest_luckin || null;
        const nearestLocation = nearestLuckin ? getAmapLocation(nearestLuckin) : null;
        if (nearestLocation) {
          const line = new window.AMap.Polyline({
            path: [
              [spotLocation.lng, spotLocation.lat],
              [nearestLocation.lng, nearestLocation.lat],
            ],
            strokeColor: "#16a34a",
            strokeWeight: 3,
            strokeOpacity: 0.9,
            strokeStyle: "dashed",
            zIndex: 180,
          });
          map.add(line);
          currentMarkers.push(line);
        }

        map.setZoomAndCenter(15, [spotLocation.lng, spotLocation.lat]);
        const nearestText =
          Number.isFinite(Number(group.nearest_luckin_distance_m))
            ? `，最近瑞幸直线距离 ${Math.round(Number(group.nearest_luckin_distance_m))} 米`
            : "";
        const validationLabel =
          group.luckin_validation_status === "found"
            ? "本点1km内已有瑞幸"
            : group.luckin_validation_status === "clear"
            ? "本点双源校验1km内无瑞幸"
            : group.luckin_validation_status === "unknown"
            ? "本点1km数据待复核"
            : "本点尚未完成双源校验";
        setMapStatus(
          `已标记热区 ${idx + 1}、1000米范围及已有瑞幸 ${luckinStores.length} 家；${validationLabel}${nearestText}。`
        );
        redrawHeatmap();
      }

      async function checkAuth() {
        if (!authToken) {
          redirectToLogin();
          return false;
        }
        try {
          const resp = await fetch(apiUrl("/auth/me"), {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          if (!resp.ok) {
            authToken = "";
            localStorage.removeItem("authToken");
            redirectToLogin();
            return false;
          }
          const data = await resp.json();
          setAuthUI(true, data.username || "");
          redirectAfterLoginIfNeeded();
          return true;
        } catch (error) {
          console.error("check_auth_failed", error);
          redirectToLogin();
          return false;
        }
      }

      async function login() {
        const username = document.getElementById("username-input").value.trim();
        const password = document.getElementById("password-input").value;
        if (!username || !password) {
          setPageMessage("请输入用户名和密码。");
          return;
        }
        try {
          const resp = await fetch(apiUrl("/auth/login"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!resp.ok) {
            setPageMessage(`登录失败：${await resp.text()}`);
            return;
          }
          const data = await resp.json();
          authToken = data.token || "";
          localStorage.setItem("authToken", authToken);
          document.getElementById("password-input").value = "";
          setAuthUI(true, data.username || username);
          setPageMessage("", false);
          if (redirectAfterLoginIfNeeded()) return;
        } catch (error) {
          console.error("login_failed", error);
          setPageMessage(`登录请求失败，请确认接口可用：${API_BASE}`);
        }
      }

      async function logout() {
        if (authToken) {
          try {
            await fetch(apiUrl("/auth/logout"), {
              method: "POST",
              headers: { Authorization: `Bearer ${authToken}` },
            });
          } catch (error) {
            console.error("logout_failed", error);
          }
        }
        authToken = "";
        localStorage.removeItem("authToken");
        setAuthUI(false);
        redirectToLogin();
      }

      function openInAmap(lat, lng, title, addr) {
        const name = encodeURIComponent(title || "选址点");
        const desc = encodeURIComponent(addr || "");
        const pos = `${lng},${lat}`;
        window.open(`https://uri.amap.com/marker?position=${pos}&name=${name}&src=luckinit&coordinate=gaode&callnative=0&content=${desc}`, "_blank");
      }

      function isLuckinName(name) {
        if (!name) return false;
        const lower = name.toLowerCase();
        return name.includes("瑞幸") || lower.includes("luckin");
      }

      function highlightSidebarItem(idx) {
        document.querySelectorAll(".hotspot-card").forEach((card) => {
          const active = Number(card.dataset.index) === idx;
          card.classList.toggle("active", active);
          if (active) {
            card.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      }

      async function focusOnHotspot(idx) {
        activeHotspotIndex = idx;
        highlightSidebarItem(idx);
        if (lastData) {
          await renderMap(lastData, idx);
        }
      }

      function renderSidebar(data) {
        const sidebar = document.getElementById("sidebar");
        const hotspots = data.hotspots || [];
        if (!hotspots.length) {
          sidebar.innerHTML =
            '<div class="hint">没有热区数据。请先分析城市，或检查后端返回。</div>';
          return;
        }

        const intro = `
          <div class="hint" style="margin-bottom:10px;">
            目标：找出“人流吸引业态多，且候选点半径 1000 米内无瑞幸”的候选热区。<br />
            同时扫描竞品、类竞品、共生品牌；同组内越靠前的品牌权重越高。扫描范围覆盖区县并延伸到乡镇。<br />
            最近瑞幸距离按候选点到门店的直线距离计算；点击热区后地图会自动定位。
          </div>
        `;

        sidebar.innerHTML = intro;
        hotspots.forEach((group, idx) => {
          const spot = group.spot || {};
          const venues = group.venues || [];
          const total = venues.length;
          const validationStatus =
            group.luckin_validation_status ||
            (group.luckin_count == null ? "unknown" : "legacy");
          const luckinCount =
            group.luckin_count == null ? null : Number(group.luckin_count);
          const luckinRadiusM = Number(group.luckin_radius_m || 1000);
          const nearestLuckinDistanceRaw = group.nearest_luckin_distance_m;
          const nearestLuckinDistanceM =
            nearestLuckinDistanceRaw == null ? null : Number(nearestLuckinDistanceRaw);
          const nearestLuckin = group.nearest_luckin || null;
          const officeCount = group.office_count || 0;
          const brandCounts = group.brand_counts || {
            competitor: 0,
            similar: 0,
            coexist: 0,
          };
          const brandMatches = group.brand_matches || [];
          const brandSignalScore = Number(group.brand_signal_score || 0);
          const priorityScore = Number(
            group.priority_score || spot.hot_score || total
          );
          const goodForLuckin =
            validationStatus === "clear" && luckinCount === 0 && total >= 5;
          const catStats = {};
          venues.forEach((item) => {
            const cat = item.category || "门店";
            catStats[cat] = (catStats[cat] || 0) + 1;
          });
          const topCats = Object.entries(catStats)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(([name, count]) => `${name} ${count}家`)
            .join(" / ");

          const card = document.createElement("div");
          card.className = "hotspot-card";
          card.dataset.index = idx;

          const titleRow = document.createElement("div");
          titleRow.className = "row";

          const title = document.createElement("div");
          title.className = "hotspot-title";
          title.textContent = `热区 ${idx + 1}：${spot.name || "未命名地点"}`;

          const openBtn = document.createElement("button");
          openBtn.className = "open-btn";
          openBtn.textContent = "高德地图";
          openBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            const loc = getAmapLocation(spot);
            if (loc) {
              openInAmap(loc.lat, loc.lng, spot.name, spot.address);
            }
          });

          titleRow.appendChild(title);
          titleRow.appendChild(openBtn);

          const meta = document.createElement("div");
          meta.className = "hotspot-meta";
          const spotLoc = getAmapLocation(spot);
          const coordText = spotLoc
            ? ` | 推荐坐标 ${Number(spotLoc.lng).toFixed(6)}, ${Number(spotLoc.lat).toFixed(6)}`
            : "";
          meta.textContent = `${spot.address || "无地址信息"} | 周边店铺 ${total} 家${coordText}`;

          const sub = document.createElement("div");
          sub.className = "hotspot-subtitle";
          const nearestLuckinText =
            Number.isFinite(nearestLuckinDistanceM) && nearestLuckinDistanceM >= 0
              ? nearestLuckinDistanceM < 1000
                ? `${Math.round(nearestLuckinDistanceM)} 米（直线）`
                : `${(nearestLuckinDistanceM / 1000).toFixed(2)} 公里（直线）`
              : "未检索到";
          const nearestLuckinName =
            nearestLuckin && nearestLuckin.name ? ` · ${nearestLuckin.name}` : "";
          const validationSources = group.luckin_validation_sources || {};
          const amapState =
            validationSources.amap?.ok === true
              ? `高德✓${validationSources.amap.count || 0}`
              : validationSources.amap
              ? "高德失败"
              : "高德未校验";
          const baiduState =
            validationSources.baidu?.ok === true
              ? `百度✓${validationSources.baidu.count || 0}`
              : validationSources.baidu
              ? "百度失败"
              : "百度未校验";
          const countText =
            luckinCount == null ? "待复核" : `${luckinCount} 家`;

          sub.innerHTML =
            `主力业态：${topCats || "暂无"} ` +
            `<span class="small-tag">${Math.round(luckinRadiusM)}m内瑞幸 ${countText}</span>` +
            `<span class="small-tag">最近瑞幸 ${nearestLuckinText}${nearestLuckinName}</span>` +
            `<span class="small-tag">办公 ${officeCount} 处</span>` +
            `<span class="small-tag">${amapState} / ${baiduState}</span>` +
            (goodForLuckin
              ? '<span class="small-tag tag-good">双源校验：1km内无瑞幸</span>'
              : validationStatus === "found"
              ? '<span class="small-tag tag-risk">排除：1km内已有瑞幸</span>'
              : validationStatus === "unknown"
              ? '<span class="small-tag tag-review">数据待复核</span>'
              : luckinCount > 0
              ? '<span class="small-tag tag-risk">1km内已有瑞幸</span>'
              : "");

          const brandLine = document.createElement("div");
          brandLine.className = "hotspot-subtitle";
          const matchedNames = brandMatches
            .slice(0, 6)
            .map((item) => item.name)
            .join(" / ");
          brandLine.innerHTML =
            `品牌信号 ${brandSignalScore.toFixed(1)} 分 · 综合优先级 ${priorityScore.toFixed(1)} ` +
            `<span class="small-tag">竞品 ${brandCounts.competitor || 0}</span>` +
            `<span class="small-tag">类竞品 ${brandCounts.similar || 0}</span>` +
            `<span class="small-tag">共生 ${brandCounts.coexist || 0}</span>` +
            (matchedNames
              ? `<br /><span style="color:#4b5563">命中：${matchedNames}</span>`
              : "");

          card.appendChild(titleRow);
          card.appendChild(meta);
          card.appendChild(sub);
          card.appendChild(brandLine);

          if (total > 0) {
            const poiList = document.createElement("ul");
            poiList.className = "poi-list";
            venues.slice(0, 6).forEach((item) => {
              const li = document.createElement("li");
              li.textContent =
                `${isLuckinName(item.name) ? "瑞幸" : "门店"} ` +
                `${item.category ? item.category + " / " : ""}` +
                `${item.name || "未命名店铺"}`;
              poiList.appendChild(li);
            });
            card.appendChild(poiList);
          }

          card.addEventListener("click", () => {
            focusOnHotspot(idx);
          });

          sidebar.appendChild(card);
        });
      }

      async function fetchAnalyzeCityData(city, refresh = false) {
        const suffix = refresh ? "&refresh=true" : "";
        const url = apiUrl(
          `/analyze_city?city=${encodeURIComponent(city)}${suffix}`
        );

        let lastError = null;
        for (let attempt = 1; attempt <= 3; attempt += 1) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 90000);
            const resp = await fetch(url, {
              headers: { Authorization: `Bearer ${authToken}` },
              signal: controller.signal,
              cache: "no-store",
            });
            clearTimeout(timer);

            if (!resp.ok) {
              const text = await resp.text();
              return { ok: false, status: resp.status, text };
            }

            const data = await resp.json();
            return { ok: true, data };
          } catch (error) {
            lastError = error;
            console.warn(
              "analyze_city_fetch_attempt_failed",
              attempt,
              error
            );
            if (attempt < 3) {
              setPageMessage(
                `本地分析服务连接不稳定，正在第 ${attempt + 1} 次重试...`,
                false
              );
              await sleep(attempt === 1 ? 800 : 1600);
            }
          }
        }

        return {
          ok: false,
          status: 0,
          text:
            lastError && lastError.message
              ? lastError.message
              : "Local analysis service unavailable",
        };
      }

      async function loadData() {
        if (!authToken) {
          setPageMessage("请先登录。");
          return;
        }
        const city = document.getElementById("city-select").value;
        if (!city) {
          setPageMessage("请选择城市。");
          return;
        }

        try {
          setPageMessage("", false);
          const cityView = CITY_VIEW[city] || CITY_VIEW.Huizhou;

          // Show the selected city immediately. If any data source fails later,
          // the user should not be left looking at Beijing by mistake.
          try {
            await ensureMapReady();
            map.setZoomAndCenter(cityView.zoom, cityView.center);
          } catch (mapError) {
            console.warn("initial_city_map_position_failed", mapError);
          }

          setMapStatus("正在分析城市并加载地图数据...");
          let result = await fetchAnalyzeCityData(city, false);

          let data = null;
          let usedAmapFallback = false;
          let usedBaiduFallback = false;

          if (!result.ok) {
            if (result.status === 401) {
              await logout();
              setPageMessage("登录已失效，请重新登录。");
              return;
            }
            setPageMessage(
              result.status === 0
                ? "本地分析接口暂时无响应，正在绕过后端并直接尝试高德/百度 POI..."
                : "Overpass 不可用，正在自动切换高德 POI；如无结果将继续切换百度 POI...",
              false
            );
            try {
              data = await buildAmapFallbackData(city);
            } catch (error) {
              console.warn("amap_fallback_failed", error);
              data = { city, hotspots: [] };
            }
            usedAmapFallback = true;
          } else {
            data = result.data;
          }

          if (!((data && data.hotspots) || []).length && !usedAmapFallback) {
            setMapStatus("Overpass 未返回有效热区，正在切换高德 POI 数据...");
            try {
              data = await buildAmapFallbackData(city);
            } catch (error) {
              console.warn("amap_fallback_failed", error);
              data = { city, hotspots: [] };
            }
            usedAmapFallback = true;
          }

          if (!((data && data.hotspots) || []).length) {
            const amapDiagnostics = data?.source_diagnostics?.amap || null;
            setPageMessage(
              "高德 POI 未生成候选点，正在自动切换百度 POI...",
              false
            );
            try {
              data = await buildBaiduFallbackData(city);
              if (amapDiagnostics) {
                data.source_diagnostics = {
                  ...(data.source_diagnostics || {}),
                  amap: amapDiagnostics,
                };
              }
            } catch (error) {
              console.warn("baidu_fallback_failed", error);
              data = {
                city,
                hotspots: [],
                source_diagnostics: amapDiagnostics
                  ? { amap: amapDiagnostics }
                  : {},
              };
            }
            usedBaiduFallback = true;
          }

          if (!usedAmapFallback && !usedBaiduFallback) {
            data = await enrichWithAmapMarketSignals(data, city);
          }

          if (((data && data.hotspots) || []).length && !usedBaiduFallback) {
            data = await enrichWithBaiduMarketSignals(data, city);
          }

          if (!((data && data.hotspots) || []).length) {
            const amapDiag = data?.source_diagnostics?.amap || {};
            const baiduDiag = data?.source_diagnostics?.baidu || {};
            const diagText =
              `高德：锚点 ${amapDiag.anchor_count ?? "?"} / 业态 ${amapDiag.attractor_count ?? "?"} / 候选 ${amapDiag.candidate_count ?? "?"}；` +
              `百度：锚点 ${baiduDiag.anchor_count ?? "?"} / 业态 ${baiduDiag.attractor_count ?? "?"} / 候选 ${baiduDiag.candidate_count ?? "?"}。`;
            setPageMessage(
              `未生成有效候选热区。数据源诊断：${diagText}`
            );
            setMapStatus(
              `暂无候选热区。请根据上方数据源诊断判断是检索为空还是地图服务失败。`
            );
            return;
          }

          setPageMessage(
            "候选点已生成，正在用高德+百度逐点校验1000米内瑞幸...",
            false
          );
          data = await validateAllCandidateLuckin(data, city);

          lastData = data;
          activeHotspotIndex = 0;

          await ensureMapReady();
          const center = cityView.center;

          const hotspots = data.hotspots || [];
          const points = [];
          hotspots.forEach((h) => {
            const spotLoc = getAmapLocation(h.spot);
            if (spotLoc) points.push([spotLoc.lng, spotLoc.lat]);
            (h.venues || []).forEach((v) => {
              const venueLoc = getAmapLocation(v);
              if (venueLoc) points.push([venueLoc.lng, venueLoc.lat]);
            });
          });

          if (points.length > 0) {
            map.setFitView();
            map.setBounds(
              new window.AMap.Bounds(
                points.reduce(
                  (min, p) => [Math.min(min[0], p[0]), Math.min(min[1], p[1])],
                  [points[0][0], points[0][1]]
                ),
                points.reduce(
                  (max, p) => [Math.max(max[0], p[0]), Math.max(max[1], p[1])],
                  [points[0][0], points[0][1]]
                )
              )
            );
            map.setCenter(center);
          } else {
            map.setZoomAndCenter(cityView.zoom, center);
          }

          renderSidebar(data);
          highlightSidebarItem(activeHotspotIndex);
          await renderMap(data, activeHotspotIndex || 0);
          if (!hotspots.length) {
            setPageMessage("未找到热区数据，已尝试重新计算，但后端仍返回空结果。");
            setMapStatus("未找到热区数据，请检查后端 Overpass 返回。");
            return;
          }
          const townshipCount = Number(data.scan_meta?.township_anchor_count || 0);
          const townshipCandidateCount = Number(
            data.scan_meta?.township_candidate_count || 0
          );
          const candidatePoolCount = Number(
            data.scan_meta?.candidate_pool_count || (data.hotspots || []).length
          );
          const baiduCalibrated = data.source_calibration?.baidu === true;
          const dualConfirmed = Number(
            data.source_calibration?.dual_source_luckin_count || 0
          );
          let successText =
            "分析完成：品牌信号已纳入排序，并显示已有瑞幸门店、1000米范围和最近瑞幸直线距离。";
          if (usedBaiduFallback) {
            successText =
              `分析完成：高德/Overpass未生成候选点，已使用百度 POI；候选池 ${candidatePoolCount} 个，其中乡镇候选 ${townshipCandidateCount} 个（发现乡镇锚点 ${townshipCount} 个）。`;
          } else if (usedAmapFallback) {
            successText =
              `分析完成：已使用高德 POI；候选池 ${candidatePoolCount} 个，其中乡镇候选 ${townshipCandidateCount} 个（发现乡镇锚点 ${townshipCount} 个）。`;
          }
          if (baiduCalibrated) {
            successText += ` 百度已参与校准，双源确认瑞幸 ${dualConfirmed} 家。`;
          }
          const validationSummary = data.luckin_validation_summary || {};
          successText +=
            ` 1000米逐点校验：无瑞幸 ${validationSummary.clear || 0} 个，` +
            `已有瑞幸 ${validationSummary.found || 0} 个，` +
            `待复核 ${validationSummary.unknown || 0} 个。`;
          setPageMessage(successText, false);
        } catch (error) {
          console.error("analyze_failed", error);
          setPageMessage(
            `分析失败：${error && error.message ? error.message : String(error)}`
          );
          setMapStatus("高德地图加载失败。");
        }
      }

      function toggleHeatmap(show) {
        if (!show) {
          clearHeatmap();
          setPageMessage("已关闭热力图。", false);
          return;
        }
        if (!lastData || !currentHeatGroup) {
          setPageMessage("请先完成分析。");
          document.getElementById("heatmap-toggle").checked = false;
          return;
        }
        redrawHeatmap();
        setPageMessage("热力图已开启。", false);
      }

      document.querySelectorAll('[data-role="toggle-filters"]').forEach((btn) => {
        btn.addEventListener("click", () => toggleFilters());
      });
      if ((localStorage.getItem("cityAnalysisFiltersCollapsed") || "") === "1") {
        document.body.classList.add("filters-collapsed");
      }
      applyFilterCollapseUI();
      document.getElementById("api-base-label").textContent = `接口：${API_BASE}`;
      checkAuth();
      ensureMapReady().catch((error) => {
        console.error("init_map_failed", error);
        setMapStatus(
          `高德地图初始化失败：${error && error.message ? error.message : String(error)}`
        );
      });
    </script>
  </body>
</html>
